pre-commit:
  parallel: true
  commands:
    secret-scan:
      glob: "*"
      # --validation=false skips the live API validation and blocks on pattern match alone.
      # For a local hook, detection is enough (whitelist false positives via .gitleaksignore).
      run: betterleaks dir {staged_files} --redact --no-banner --validation=false
      fail_text: "🚫 Possible secret detected. Review before committing; add to .gitleaksignore if it's a false positive."
