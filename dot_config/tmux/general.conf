# 256色モードを有効化
set-option -g default-terminal screen-256color
set -g terminal-overrides 'xterm:colors=256'

# マウス操作を有効化
set-option -g mouse on

# window を閉じたとき番号を詰める
set -g renumber-windows on

set -s escape-time 0           # ESC 遅延ゼロ (vi mode で重要)
set -g history-limit 50000     # スクロールバッファを 50k 行
set -g focus-events on         # focus event 通知 (helix auto-save と連動)
set -g display-time 4000       # status message 表示時間 (ms)
set -g status-interval 5       # status 更新間隔 (秒)
setw -g aggressive-resize on   # 複数 client 接続時の resize 改善

# Yazi など TUI アプリの画像描画を許可
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
