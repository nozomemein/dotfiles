# Enable 256-color mode
set-option -g default-terminal screen-256color
set -g terminal-overrides 'xterm:colors=256'

# Enable mouse support
set-option -g mouse on

# Renumber windows when one is closed
set -g renumber-windows on

set -s escape-time 0           # No ESC delay (important for vi mode)
set -g history-limit 50000     # 50k-line scrollback buffer
set -g focus-events on         # Forward focus events (works with helix auto-save)
set -g display-time 4000       # Status message display time (ms)
set -g status-interval 5       # Status refresh interval (seconds)
setw -g aggressive-resize on   # Better resize behavior with multiple clients

# Allow passthrough for TUI apps that draw images (e.g. Yazi)
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
