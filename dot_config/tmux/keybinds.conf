# プレフィックスキーを Ctrl-Space に変更
set -g prefix C-space
unbind C-b

# pane resize (prefix + H/J/K/L)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# 分割・新規ウィンドウ作成時にカレントパスを引き継ぐ
bind % split-window -h -c '#{pane_current_path}'
bind '"' split-window -v -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'

# prefix + Space で next-layout (last-window は prefix + l で別途使える)
bind Space next-layout

# yazi をポップアップで起動
bind-key y display-popup -d '#{pane_current_path}' -x R -h 95% -w 95% -E 'tmux new-session yazi \; set status off'

# lazygit をポップアップで起動
bind-key g popup -E -w 95% -h 95% -d '#{pane_current_path}' lazygit

# copy mode を vi-like に
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi H send-keys -X start-of-line
bind-key -T copy-mode-vi L send-keys -X end-of-line
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi Y send-keys -X copy-line
