set -g @plugin 'tmux-plugins/tpm'

# catppuccin
set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_flavour 'mocha' # or frappe, macchiato, mocha
set -g @catppuccin_status_modules "... battery ..."

# tmux-fzf (configured via env vars; the @ prefix has no effect here)
set -g @plugin 'sainnhe/tmux-fzf'
TMUX_FZF_LAUNCH_KEY="C-f"
TMUX_FZF_OPTIONS="-p -w 80% -h 80% -m"


# tmux-continuum, tmux-resurrect
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# tmux-thumbs
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @thumbs-key F
set -g @thumbs-command 'tmux set-buffer -- {} && echo -n {} | pbcopy && tmux display-message "Copied {}"'

# Initialize TMUX plugin manager (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'

# tmux-thumbs needs its own entry script to run after tpm has loaded
run-shell ~/.tmux/plugins/tmux-thumbs/tmux-thumbs.tmux
