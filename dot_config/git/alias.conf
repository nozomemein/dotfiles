[alias]
	sw = switch
  s = status
	ss = status -sb
	co = checkout
  br = branch
  ap = add -p
  cp = cherry-pick
  # Squash changes into an earlier commit.
  #   With staged changes:
  #     git fixup           -> fixup staged into HEAD
  #     git fixup <sha>     -> fixup staged into <sha>
  #     git fixup <sha> -r  -> reword (also edit the message)
  #   Without staged changes (squash an existing HEAD commit):
  #     git fixup           -> squash HEAD into HEAD~1
  #     git fixup <sha>     -> squash HEAD into <sha>
  fixup = "!f() { \
    target=\"\"; mode=fixup; \
    for arg in \"$@\"; do \
      case \"$arg\" in \
        -r|--reword) mode=reword;; \
        -a|--amend)  mode=amend;; \
        *)           target=\"$arg\";; \
      esac; \
    done; \
    if [ -z \"$target\" ]; then \
      if git diff --cached --quiet; then target=HEAD~1; else target=HEAD; fi; \
    fi; \
    sha=$(git rev-parse --verify \"$target\") || return 1; \
    if ! git diff --cached --quiet; then \
      if [ \"$mode\" = fixup ]; then \
        git commit --fixup=\"$sha\" || return 1; \
      else \
        git commit --fixup=\"$mode:$sha\" || return 1; \
      fi; \
    elif [ \"$sha\" != \"$(git rev-parse HEAD)\" ]; then \
      msg=$(git log -1 --format=%s \"$sha\") || return 1; \
      git commit --amend -m \"fixup! $msg\" || return 1; \
    else \
      echo \"fixup: nothing to do (no staged changes; target is HEAD)\" >&2; return 1; \
    fi; \
    GIT_SEQUENCE_EDITOR=: git rebase -i --autosquash \"$sha^\"; \
  }; f"
